[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlss5-enhance"
version = "1.2.0"
description = "On-demand CLI driver for the ComfyUI DLSS5-Enhancer node"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "websocket-client>=1.7",
    "PyYAML>=6.0",
    "tkinterdnd2>=0.4",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
dlss5-enhance = "dlss5_enhance.__main__:main"

[tool.setuptools]
packages = ["dlss5_enhance"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", ".tmp-it"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF046", "SIM115"]

[tool.ruff.lint.per-file-ignores]
"dlss5_enhance/i18n.py" = ["E501"]
